[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radar-api"
version = "0.1.0"
description = "GitHub Rising Radar API — FastAPI backend for early breakout detection"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "radar-scoring>=0.1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/radar_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "A", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
